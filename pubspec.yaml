name: gold
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.1.5+5

environment:
  sdk: ^3.7.2


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  get: ^4.7.2
  flutter_easyloading: ^3.0.5
  dio: ^5.8.0+1
  fluttertoast: ^8.2.12
  flutter_upi_india: ^0.0.6
  barcode: ^2.2.9
  flutter_svg: ^2.1.0
  flutter_image_slideshow: ^0.1.6
  drop_down_search_field: ^1.1.3
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^17.2.3
  equatable: ^2.0.7

icons_launcher:
  # image_path: "assets/images/launcher_icon.png"
  image_path: "assets/images/logo2.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true
package_rename_config:
  android:
    app_name: "Kalki Matka" 
    package_name: "com.gold.kalyan.matkaplay"

dev_dependencies:
  icons_launcher: ^2.1.7
  package_rename: ^1.5.3
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/icons/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

